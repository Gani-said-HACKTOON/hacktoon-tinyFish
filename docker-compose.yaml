version: "3"

services:
  agent:
    build: ./agent
    ports:
      - "8000:8000"

  backend:
    build: ./backend
    ports:
      - "3000:3000"
    

  db:
    image: postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"