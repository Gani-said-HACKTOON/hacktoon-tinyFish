version: "3"

services:
  agent:
    build: ./agent
    ports:
      - "8000:8000"
    depends_on:
      - backend

  backend:
    build: 
      context: .
      dockerfile: ./backend/Dockerfile
      args:
        DATABASE_URL: ${DATABASE_URL}
    ports:
      - "3000:3000"
    depends_on:
        - db

  db:
    image: postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - ./testfs:/var/lib/pgsql/data